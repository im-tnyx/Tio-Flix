name: Deploy Supabase Cloud

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy database and Edge Functions
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PLAYBACK_CDN_BASE_URL: ${{ secrets.PLAYBACK_CDN_BASE_URL }}
      PLAYBACK_SIGNING_SECRET: ${{ secrets.PLAYBACK_SIGNING_SECRET }}
      PLAYBACK_URL_TTL_SECONDS: ${{ secrets.PLAYBACK_URL_TTL_SECONDS }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            SUPABASE_ACCESS_TOKEN
            SUPABASE_PROJECT_ID
            SUPABASE_DB_PASSWORD
            PLAYBACK_CDN_BASE_URL
            PLAYBACK_SIGNING_SECRET
            PLAYBACK_URL_TTL_SECONDS
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Environment secret: $name" >&2
              exit 1
            fi
          done

      - name: Link Supabase project
        shell: bash
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply database migrations
        shell: bash
        run: supabase db push --linked

      - name: Configure Edge Function secrets
        shell: bash
        run: |
          set -euo pipefail
          secret_file="supabase/functions/.env"
          trap 'rm -f "$secret_file"' EXIT
          umask 077
          printf '%s\n' \
            "PLAYBACK_CDN_BASE_URL=$PLAYBACK_CDN_BASE_URL" \
            "PLAYBACK_SIGNING_SECRET=$PLAYBACK_SIGNING_SECRET" \
            "PLAYBACK_URL_TTL_SECONDS=$PLAYBACK_URL_TTL_SECONDS" \
            > "$secret_file"
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --env-file "$secret_file"

      - name: Deploy Edge Functions
        shell: bash
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
